services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: chronicle_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle -d chronicle"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://chronicle:chronicle_dev@postgres:5432/chronicle
      FRONTEND_URL: http://localhost:3000
      LLM_MODEL: ai/llama3.2:1B-Q4_0
      LLM_PROVIDER: dmr
      LLM_BASE_URL: http://model-runner.docker.internal:12434/engines/v1
      EMBEDDING_MODEL: ai/qwen3-embedding:0.6B-F16
      EMBEDDING_BASE_URL: http://model-runner.docker.internal:12434/engines/llama.cpp/v1
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
